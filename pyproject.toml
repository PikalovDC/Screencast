[project]
name = "screencast"
version = "0.1.0"
description = ""
authors = [
    {name = "dmitry pikalov",email = "pikalovds@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.1.1,<2.0.0",
    "requests>=2.32.5,<3.0.0",
    "pandas>=2.3.3,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "django>=6.0.1,<7.0.0",
    "psycopg2>=2.9.11,<3.0.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
    "redis>=7.3.0,<8.0.0",
    "pillow>=12.1.0,<13.0.0",
    "sqlparse>=0.5.5,<1.0.0",
    "asgiref>=3.11.0,<4.0.0",
    "pytz>=2025.2,<2026.0",
    "tzdata>=2025.3,<2026.0",
    "certifi>=2026.1.4,<2027.0",
    "charset-normalizer>=3.4.4,<4.0.0",
    "idna>=3.11,<4.0.0",
    "urllib3>=2.6.3,<3.0.0",
    "et_xmlfile>=2.0.0,<3.0.0",
    "numpy>=2.4.1,<3.0.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "six>=1.17.0,<2.0.0"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.12.0"
isort = "^6.1.0"
mypy = "^1.19.1"
pycodestyle = "^2.14.0"
pyflakes = "^3.4.0"
mccabe = "^0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
coverage = "^7.13.1"
iniconfig = "^2.3.0"
packaging = "^25.0"
pluggy = "^1.6.0"

[tool.black]
line-length = 119
exclude = '.git'

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.isort]
line_length = 119